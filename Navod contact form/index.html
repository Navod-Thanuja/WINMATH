<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback form</title>
    <link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="assets/logo.png">
</head>
<body>
    <div class="Contact-container">
        <form action="https://api.web3forms.com/submit" method="POST" class="Contact-left">
            <div class="contact-left-title">
                <h2>Your Feedback</h2>
                <hr>
            </div>
            <input type="hidden" name="access_key" value="4fd5d429-4ea5-44ad-ab1f-0af4f62761d9">
            <input type="text" name="name" placeholder="Your Name" class="contact-inputs" required>
            <input type="email" name="email" placeholder="Our Email" class="contact-inputs" required>
            <textarea name="message" placeholder="Your Message" class="contact-inputs" required></textarea>
            <button type="submit">Submit<img src="assets/arrow_icon.png" alt=""></button>
        </form>
        <div class="contact-right">
            <img src="assets/right_img.png" alt="">
        </div>
    </div>
    
    
</body>
</html>
